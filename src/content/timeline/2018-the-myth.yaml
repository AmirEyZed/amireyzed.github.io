summary:
  fa: "The Myth رو با بازیکن‌هایی ساختم که اون موقع تیم نداشتن. از لیگ الماس پرشین پرولیگ خودمون رو به رویال لیگ، بالاترین سطح مسابقات، رسوندیم و ۲۷ مه نایب‌قهرمان ProLeague by ESL IR شدیم."
  en: "I built The Myth from players who had no team at the time. We worked our way up from the Persian Pro League Diamond League to the Royale League, the top tier, and on May 27 we finished runner-up in ProLeague by ESL IR."
