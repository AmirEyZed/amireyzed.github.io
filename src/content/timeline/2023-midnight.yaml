featured: true
title:
  fa: "میدنایت"
  en: "The MidNight"
summary:
  fa: "۱۰ مارس «میدنایت» رو روی کانال اصلیم شروع کردم؛ یه برنامه مصاحبه شبانه که تحقیق، کارگردانی و اجراش با خودم بود. فصل اول ۲۳ قسمت داشت، با مهمون‌هایی از یوتیوب و استریم تا رپ و دوبله."
  en: "On March 10 I started The MidNight on my main channel, a late-night interview show I researched, directed and hosted myself. Season one had 23 episodes, with guests from YouTube and streaming to rap and dubbing."
why:
  fa: "میدنایت نقطه‌ای بود که کانال اصلیم از هایلایت‌های گیم رفت سمت گفت‌وگوهای بلند."
  en: "The MidNight is where my main channel moved from gaming highlights to long conversations."
