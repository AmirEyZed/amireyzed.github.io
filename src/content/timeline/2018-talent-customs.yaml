# Source: Tryout customs for teamless players, picks recommended to team leaders (#12428, #12455, #12792); most picks joined teams by 1 Aug (#12984); free entry for those who could not pay (#13086).
year: 2018
order: 4
title:
  fa: "کاستوم‌های استعدادیابی"
  en: "Talent-scouting customs"
summary:
  fa: "جولای برای بازیکن‌های بی‌تیم رینبو کاستوم تست گذاشتم و بهترین‌هاشون رو مستقیم به لیدر تیم‌ها معرفی کردم. هر کی هم پول ورودی نداشت، رایگان بازی کرد. یه هفته بعد بیشتر بازیکن‌های منتخب تیم‌دار شده بودن."
  en: "In July I ran tryout customs for teamless Rainbow Six players and recommended the best of them straight to team leaders. Anyone who couldn’t pay the entry fee played for free. A week later most of the picked players had joined teams."
