# Source: SAHNE unveiled 22 Aug 2026, private beta, not publicly released as of 23 Sep (#79966, #79979, #81181); to be released open source (#81095); SAHNE+ released 18 Sep as a separate app (#81070, #81095), free, open source under Apache-2.0, Windows installer on its GitHub releases page (github.com/AmirEyZed/sahne-plus, checked 24 Sep 2026); why he builds apps (#81106).
year: 2026
order: 4
featured: true
title:
  fa: "صحنه و صحنه پلاس"
  en: "SAHNE and SAHNE+"
summary:
  fa: "۲۲ اوت «صحنه» رو معرفی کردم؛ اپ دسکتاپی که با کمک هوش مصنوعی ساختم تا بخش‌های مختلف اورلی استریم، از چت و تعداد بیننده تا دونیت و تایمر دوناتون، یک‌جا مدیریت بشن. ۱۸ سپتامبر هم «صحنه پلاس» رو منتشر کردم؛ یه اپ جدا، سبک‌تر و عمومی برای مدیریت و پخش الرت‌های دونیت، ساب و گیفت‌ساب."
  en: "On August 22 I introduced SAHNE, a desktop app I built with AI help to run the different parts of a stream overlay in one place, from chat and viewer count to donations and a donathon timer. On September 18 I released SAHNE+, a separate, lighter public app for managing and playing donation, sub and gifted-sub alerts."
why:
  fa: "چیزی که اول برای نیازهای استریم خودم ساختم، تبدیل شد به ابزار رایگان و اپن‌سورسی که بقیه استریمرها هم می‌تونن ازش استفاده کنن."
  en: "What I first built for my own stream became a free, open-source tool other streamers can use too."
highlights:
