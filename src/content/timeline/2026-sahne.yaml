  en: "SAHNE and SAHNE+"
summary:
  fa: "۲۲ اوت «صحنه» رو معرفی کردم: اپ دسکتاپی که با کمک هوش مصنوعی ساختم تا اورلی استریم رو مدیریت کنه، از تعداد بیننده و چت تا هدف دونیت و تایمر دوناتون. ۱۸ سپتامبر هم «صحنه پلاس» رو منتشر کردم؛ یه اپ جدا و ساده‌تر که فقط گیف‌های هشدار دونیت، ساب و گیفت‌ساب کیک رو پخش می‌کنه."
  en: "On August 22 I introduced SAHNE, a desktop app I built with AI help to run stream overlays, from viewer count and chat to donation goals and a donathon timer. On September 18 I released SAHNE+, a separate, simpler app that only plays GIF alerts for Kick donations, subs and gifted subs."
why:
  fa: "ابزاری برای بقیه استریمرها، بدون هیچ منفعت شخصی."
  en: "Tools for other streamers, with no personal gain."
