# Source: Back on Twitch 29 Jan 2023 (#43703, #43705); average viewers about 3,000 before the Twitch block, 150 after, 700 by Jan 2024 (#52274).
year: 2023
order: 1
title:
  fa: "بازگشت به استریم"
  en: "Back on stream"
summary:
  fa: "۲۹ ژانویه، بعد از پنج ماه، دوباره روی توییچ لایو رفتم. توییچ حالا توی ایران فیلتر بود و میانگین بیننده‌هام از حدود ۳ هزار به ۱۵۰ رسیده بود؛ یه سال بعد دوباره به ۷۰۰ رسوندیمش و هنوز رو به رشد بود."
  en: "On January 29, after five months, I went live on Twitch again. Twitch was now blocked in Iran and my average audience had dropped from about 3,000 to 150. A year later we had brought it back to 700, and it was still growing."
