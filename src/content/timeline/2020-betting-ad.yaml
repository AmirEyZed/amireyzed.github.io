# Source: Three-hour live talk on a streamer’s betting-site ad, 29–30 Apr 2020; he pledged not to repeat it and to give the fee to charity (#32790, #32793–32796, #38571).
year: 2020
order: 3
title:
  fa: "نه به تبلیغ شرط‌بندی"
  en: "No to betting ads"
summary:
  fa: "آوریل وقتی یه استریمر محبوب سایت شرط‌بندی تبلیغ کرد، با حضور خودش حدود سه ساعت لایو درباره ضررهای شرط‌بندی حرف زدیم. آخرش قبول کرد این تبلیغ رو تکرار نکنه و پولش رو به خیریه بده. به بیننده‌ها هم گفتم: از ماها بت نسازید."
  en: "In April, when a popular streamer advertised a betting site, we spent about three hours live with him talking about the harm of gambling. In the end he agreed not to run that ad again and to give the fee to charity. I told my viewers: don’t make idols of us."
why:
  fa: "برای من تبلیغ همیشه یه خط قرمز ساده داشته: چیزی که می‌دونم ممکنه به مخاطبم آسیب بزنه، ارزش پولش رو نداره."
  en: "Ads have always had one simple red line for me: nothing I know could hurt my audience is worth the money."
