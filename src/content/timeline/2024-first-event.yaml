title:
  fa: "اولین ایونت حضوری"
  en: "My first in-person event"
summary:
  fa: "۱۳ دسامبر اولین ایونت حضوریم رو با Sequence Community توی یه کافه در تهران برگزار کردیم؛ درباره استریم و شبکه‌های اجتماعی حرف زدیم، پرسش‌وپاسخ داشتیم و چند مهمون سوپرایزی هم اومدن. بلیت‌ها توی حدود سه ساعت تموم شد. بعدها به‌خاطر تغییر عقایدشون با این تیم به مشکل خوردم، ولی اون موقع بچه‌های تازه‌کاری بودن که کارشون رو خوب انجام دادن و همکاریمون خروجی خوبی داشت."
  en: "On December 13 I held my first in-person event with Sequence Community at a café in Tehran: we talked about streaming and social media, did a Q&A, and a few surprise guests came. Tickets sold out in about three hours. Later I fell out with this team over a change in their views, but at the time they were newcomers who did their work well, and our collaboration turned out well."
