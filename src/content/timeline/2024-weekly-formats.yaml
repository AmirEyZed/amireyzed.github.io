summary:
  fa: "آخر مارس دو فرمت هفتگی راه انداختم: «مزه‌تایم»، گپ گروهی با پیکسی، امیرفانتوم، سام صابری، علی زلزله، سمیرا سالی و سیابچ؛ و «ویک‌واچ»، نقد هفتگی ویدیوهای تازه یوتیوب فارسی که چند یوتیوبر نقدهاش رو توی ویدیوی بعدیشون اعمال کردن."
  en: "At the end of March I launched two weekly formats: MazzeTime, a group talk show with Pixie, AmirPhantom, Sam Saberi, Ali Zelzele, Samira Saly and Siabach; and WeekWatch, a weekly review of new Persian YouTube videos whose notes several creators applied in their next video."
