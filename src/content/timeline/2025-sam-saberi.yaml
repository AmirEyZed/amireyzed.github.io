summary:
  fa: "از ۱۶ نوامبر تا ۲۱ دسامبر با سام صابری، بهترین گیمر و بهترین دوناتون The One Awards، از استودیو موزلند یه دوناتون مشترک روی کیک گذاشتیم: هر دونیت به یکی، یک‌چهارمِ همون زمان رو از تایمر اون یکی کم می‌کرد."
  en: "From November 16 to December 21, Sam Saberi, Best Gamer and Best Donathon at The One Awards, and I ran a joint donathon on Kick from the MoZ Land studio: every donation to one of us took a quarter of that time off the other’s timer."
