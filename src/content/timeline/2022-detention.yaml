# Source: His public statement of 16 Feb 2026 (#76282, #76283); release photo posted the same day, blurred except Amir and Moones.
year: 2022
order: 4
title:
  fa: "بازداشت مادرم و خودم"
  en: "My mother’s arrest, then mine"
summary:
  fa: "نوامبر مادرم روز تولدش به‌خاطر فعالیتش در اون روزها بازداشت شد. همون موقع فعالیت سیاسیم رو کنار گذاشتم تا پرونده‌ش سنگین‌تر نشه و هر روز جلوی زندان اوین منتظر خبری ازش بودیم. حدود ۲۰ روز بعد، هم‌زمان با بازی‌های تیم ملی در جام جهانی، خودم هم برای پرونده‌ای جدا بازداشت شدم. اول مادرم و بعد من با وثیقه آزاد شدیم و فوریهٔ ۲۰۲۳ عفو عمومی پرونده‌هامون رو بست."
  en: "In November my mother was arrested on her birthday over her activity during those days. I dropped my political posts at once so I wouldn’t make her case worse, and every day we waited outside Evin Prison for news of her. About 20 days later, while Iran’s national team was playing at the World Cup, I was arrested too, in a separate case. My mother was released on bail first, then I was, and in February 2023 a general amnesty closed our cases."
highlights:
  fa:
    - "این ماجرا رو تا فوریهٔ ۲۰۲۶ علنی تعریف نکرده بودم"
  en:
    - "I didn’t tell this story publicly until February 2026"
images:
  - src: ./2022-release.jpg
    alt: { fa: "لحظهٔ آزادی", en: "The moment of release" }
