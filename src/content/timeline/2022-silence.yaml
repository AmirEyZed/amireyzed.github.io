# Source: His public statement of 16 Feb 2026 (#76282); last stream before the break 12 Sep 2022 (#43469).
year: 2022
order: 3
title:
  fa: "سکوت به احترام اون روزها"
  en: "Going silent out of respect"
summary:
  fa: "بعد از جان باختن مهسا امینی دیگه لایو نرفتم؛ آخرین استریمم ۱۲ سپتامبر بود. یوتیوب و استریم رو متوقف کردم تا ابزار عادی‌سازی نباشم و از بقیه هم خواستم همین کار رو بکنن. سر همین انتخاب، بعضی‌ها ارتباطشون رو باهام قطع کردن."
  en: "After Mahsa Amini’s death I stopped going live; my last stream had been on September 12. I paused YouTube and streaming so I wouldn’t be a tool of normalization, and I asked others to do the same. Some people cut ties with me over that choice."
