# Source: His public statement of 16 Feb 2026 (#76282); last stream before the break 12 Sep 2022 (#43469).
year: 2022
order: 3
title:
  fa: "سکوت به احترام اون روزها"
  en: "Going silent out of respect"
summary:
  fa: "بعد از جان‌باختن مهسا امینی فعالیت یوتیوب و استریمم رو متوقف کردم؛ آخرین لایوم ۱۲ سپتامبر بود. نمی‌خواستم با ادامه محتوای سرگرمی بخشی از عادی‌سازی شرایط باشم و از بقیه هم خواستم همین کار رو بکنن. سر همین تصمیم، ارتباطم با بعضی‌ها قطع شد."
  en: "After Mahsa Amini’s death I stopped my YouTube and streaming; my last live stream was on September 12. I didn’t want to keep making entertainment and be part of normalizing the situation, and I asked others to do the same. Some people cut ties with me over that decision."
