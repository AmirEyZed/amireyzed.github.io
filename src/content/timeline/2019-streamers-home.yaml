# Source: StreamersHome channel for new streamers, 17–19 Feb 2019 (#22679, #22907); 300 members and the host/raid habit (#24323, 4 Apr); 24 streamer-admins (#26087, 26 May).
year: 2019
order: 1
title:
  fa: "خونه استریمرها"
  en: "Streamers’ Home"
summary:
  fa: "فوریه «خونه استریمرها» رو برای استریمرهای تازه‌کار ساختم. خودشون ادمین کانال بودن و می‌تونستن مستقیم خودشون و استریمشون رو معرفی کنن. بعد از لایوهام هم استریمرهای کوچیک‌تر رو هاست و رید می‌کردم."
  en: "In February I opened Streamers’ Home, a Telegram channel for new streamers. They ran it as admins, so they could introduce themselves and their streams directly. After my streams I also hosted or raided smaller streamers."
highlights:
  fa:
