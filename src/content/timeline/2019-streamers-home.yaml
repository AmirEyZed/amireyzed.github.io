# Source: StreamersHome channel for new streamers, 17–19 Feb 2019 (#22679, #22907); 300 members and the host/raid habit (#24323, 4 Apr); 24 streamer-admins (#26087, 26 May).
year: 2019
order: 1
title:
  fa: "خونهٔ استریمرها"
  en: "Streamers’ Home"
summary:
  fa: "فوریه کانال «خونهٔ استریمرها» رو برای استریمرهای تازه‌کار ساختم و خودشون رو ادمینش کردم تا جلوی ممبرها کانالشون رو معرفی کنن. بعد از هر استریم هم استریمرهای کوچیک‌تر از خودم رو هاست و رید می‌کردم."
  en: "In February I opened Streamers’ Home, a Telegram channel for new streamers, and made them its admins so they could introduce their channels to its members. After every stream I also hosted or raided streamers smaller than me."
