  en: "Twitch Partner"
summary:
  fa: "۱۷ اکتبر پارتنر توییچ شدم. دسامبر هم تیم R6 Persian Community رو برای همه استریمرهای ایرانی رینبو ساختم و همون شب مشکل حساب‌نشدن بیننده‌های ایرانی رو با مدرک به پشتیبانی توییچ رسوندم؛ فرداش درست شده بود."
  en: "On October 17 I became a Twitch Partner. In December I created the R6 Persian Community team for every Iranian Rainbow Six streamer, and that same night I sent Twitch support proof that Iranian viewers weren’t being counted. By the next day it was fixed."
why:
  fa: "مسیری که با استریم‌های آموزشی رینبو شروع کرده بودم، حالا به پارتنری رسمی توییچ رسیده بود."
  en: "The road that began with Rainbow Six teaching streams had reached official Twitch Partner status."
