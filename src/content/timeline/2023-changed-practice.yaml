# Source: His summary of "EyZed drama" and its results, 25 Jun 2023 (#45873, #45874, #45875); content-theft case resolved (#47949).
year: 2023
order: 4
title:
  fa: "حاشیه‌هایی که نتیجه داد"
  en: "Drama that changed habits"
summary:
  fa: "ژوئن یه جمع‌بندی از «حاشیه‌های ایزد» منتشر کردم و نتیجه چندتا از بحث‌هایی که پیگیری کرده بودم رو کنار هم گذاشتم: چهره مردم دیگه بدون اجازه نمایش داده نشد، تبلیغ سایت بت تکرار نشد و از ویدیوهای بعدی برای محتوای بقیه منبع گذاشته شد."
  en: "In June I published a roundup of “EyZed’s drama” and put the results of a few issues I had pushed side by side: people’s faces were no longer shown without consent, betting-site ads weren’t repeated, and later videos credited other people’s content."
why:
  fa: "خیلی از این بحث‌ها با اسم «حاشیه» شروع شد، ولی نتیجه‌شون فقط دعوا و حرف نبود؛ تغییر واقعی هم اتفاق افتاد."
  en: "Many of these started out being called drama, but they led to more than arguments: real change happened."
