# Source: His summary of "EyZed drama" and its results, 25 Jun 2023 (#45873, #45874, #45875); content-theft case resolved (#47949).
year: 2023
order: 4
title:
  fa: "حاشیه‌هایی که نتیجه داد"
  en: "Drama that changed habits"
summary:
  fa: "ژوئن خلاصه کردم «حاشیه‌های ایزد» به کجا رسید: گفتم چهره مردم رو بدون اجازه نشون ندید، از بعدش سانسور شد. گفتم تبلیغ سایت بت نکنید، دیگه تکرار نشد. گفتم محتوای بقیه رو ندزدید، از ویدیوهای بعدی منبع داده شد."
  en: "In June I summed up where “EyZed’s drama” had led. I asked creators not to show people’s faces without consent, and they started blurring them. I asked them not to advertise betting sites, and it stopped. I asked them not to take other people’s content, and they started crediting sources."
why:
  fa: "اسمش رو گذاشتن حاشیه، ولی هر کدوم یه عادت بد رو توی یوتیوب فارسی عوض کرد."
  en: "People called it drama, but each one changed a bad habit on Persian YouTube."
