title:
  fa: "گیم بتل دیجی‌کالا"
  en: "Digikala Game Battle"
summary:
  fa: "جمعه ۱۶ اکتبر با سام صابری و در همکاری با دیجی‌کالا و دیجی‌کالا گیمینگ، ایونت حضوری «گیم بتل دیجی‌کالا» رو تو فروشگاه حضوری دیجی‌کالا برگزار کردیم؛ مسابقه FC 27 بین ۱۶ نفر از پلیرهای برتر ایران."
  en: "On Friday, October 16, together with Sam Saberi and in partnership with Digikala and Digikala Gaming, we held Digikala Game Battle, a live event at Digikala's in-person store: an FC 27 tournament between 16 of Iran's top players."
why:
  fa: "بیننده‌ها و پلیرهای برتر FC این بار نه پشت صفحه، که حضوری تو یه سالن کنار هم بودن."
  en: "Viewers and top FC players came together in person this time, not just on a screen."
