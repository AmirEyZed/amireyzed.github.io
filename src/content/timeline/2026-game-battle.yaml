# Source: told by him on 18 Oct 2026: joint event with Sam Saberi with Digikala and Digikala Gaming, Friday 24 Mehr 1405 (16 Oct 2026), FC 27 among 16 top Iranian players, 1,500 in-person spectators per the organizer. Photos: higher-quality originals he sent on 18 Oct 2026 (also in #81663, #81660); the champion's prize of 200 million toman is on the cheque in the photo. In the photos (per him): the man with the tablet is Mohammad Hossein, the host and his wife's brother (he allowed naming the relation); the one in the white T-shirt is Sam Saberi.
