summary:
  fa: "با NoTeamSquad در فصل هفتم پرشین پرولیگ بازی کردیم و پنجم کشور شدیم. آوریل گفتم از رقابت یه قدم عقب می‌کشم و یوتیوب رو جدی شروع می‌کنم؛ این آخرین فصل رقابتی رینبوی من بود."
  en: "With NoTeamSquad I played Persian Pro League Season 7 and we finished fifth in Iran. In April I said I was stepping back from competition to take YouTube seriously; it was my last competitive Rainbow Six season."
