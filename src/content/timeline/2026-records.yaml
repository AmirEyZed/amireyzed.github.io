featured: true
title:
  fa: "دوناساباتون و دو رکورد"
  en: "DonaSubathon and two records"
summary:
  fa: "بعد از برگشتن، دوناساباتون رو روی کیک شروع کردیم. ۴ ژوئن توی یه استریم ۲ میلیارد تومن دونیت گرفتم؛ بیشترین دونیت یه استریم توی کامیونیتی فارسی. رکورد بیشترین ساب دریافتی کیک توی کامیونیتی فارسی هم دست منه: فقط یکی از حامی‌ها ۵٬۷۲۴ ساب گیفت کرد."
  en: "After coming back we started the DonaSubathon on Kick. On June 4 I received 2 billion toman in donations in a single stream, the most for one stream in the Persian-speaking community. I also hold the Persian community’s record for subs received on Kick: one supporter alone gifted 5,724 subs."
why:
  fa: "بعد از ماه‌ها قطعی اینترنت، کامیونیتی این‌طوری از برگشتنم استقبال کرد."
  en: "After months of internet shutdown, this is how the community welcomed me back."
highlights:
  fa:
    - "بیش از ۶٬۴۰۰ ساب گیفتی فقط از ده حامی اول"
  en:
    - "More than 6,400 gifted subs from the top ten supporters alone"
