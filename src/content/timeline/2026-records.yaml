title:
  fa: "دوناساباتون و دو رکورد"
  en: "DonaSubathon and two records"
summary:
  fa: "بعد از برگشتن، دوناساباتون رو روی کیک شروع کردیم. ۴ ژوئن توی یک استریم ۲ میلیارد تومن دونیت گرفتم و رکورد بیشترین دونیت در یک استریم فارسی ثبت شد. رکورد بیشترین ساب دریافتی بین استریمرهای فارسی کیک هم روی کانال من ثبت شد؛ فقط یکی از حامی‌ها ۵٬۷۲۴ ساب گیفت کرد."
  en: "After coming back we started the DonaSubathon on Kick. On June 4 I received 2 billion toman in donations in a single stream, a record for a Persian stream. The record for the most subs received among Persian streamers on Kick is also on my channel: one supporter alone gifted 5,724 subs."
why:
  fa: "بعد از بیش از ۳ هزار ساعت دوری از استریم، این استقبال کامیونیتی از برگشتنم بود."
  en: "After more than 3,000 hours away from streaming, this is how the community welcomed me back."
highlights:
  fa:
