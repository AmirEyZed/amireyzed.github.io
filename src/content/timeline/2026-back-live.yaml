# Source: Last stream 5–6 Jan 2026 (#76562); no streams after the events of 8–9 January and then the war, in his own words (2026-09-24; #76563); internet shutdowns, studio packed up (#75830, #76846, #76887); back live on Kick 28 May with the "After 3000 hours" poster (#77345, #77457).
