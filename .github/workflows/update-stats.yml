name: Weekly stats

# Every Friday at 08:00 Tehran time: refresh followers, subscribers, views and video counts
# (scripts/update-stats.mjs), commit src/data/live-stats.json and redeploy the site.
on:
  schedule:
    - cron: '30 4 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Read the latest numbers
        run: node scripts/update-stats.mjs
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/live-stats.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-stats.json
          git commit -m "Weekly stats update"
          git push
          # A push made with the workflow token does not start other workflows, so start the deploy directly.
          gh workflow run deploy.yml --ref main
